name: build

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build front end
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build --sdist --wheel   # both from the source tree; the default builds the wheel from the sdist, which excludes static/

      - name: Verify the wheel contains the front end
        run: unzip -l dist/*.whl | grep static/index.html

      - name: Run tests
        run: uv run --dev pytest

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    # Attach the wheel and sdist to a GitHub release so students can run
    # `uvx --from <wheel url> rtl-playground` without PyPI, Node, or Git.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          flags=""
          case "$tag" in *a*|*b*|*rc*) flags="--prerelease";; esac
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes $flags
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    # PyPI trusted publishing; enable by setting the repository variable
    # PUBLISH_PYPI=true after configuring the publisher on pypi.org.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no API token needed
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: Publish to PyPI
        run: uv publish
