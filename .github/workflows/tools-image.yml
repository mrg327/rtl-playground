name: tools image

# Builds the Docker image the Project view runs its tools in. Push a tag
# like tools-2026.09 to publish ghcr.io/<owner>/rtl-playground-tools:2026.09.
on:
  push:
    tags: ["tools-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 2026.09"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_REF_NAME#tools-}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rtl-playground-tools:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the sad_pe template
        run: |
          img=ghcr.io/${{ github.repository_owner }}/rtl-playground-tools:${{ steps.tag.outputs.tag }}
          cp -r src/rtl_playground/templates/sad_pe /tmp/sad_pe
          docker run --rm -v /tmp/sad_pe:/work "$img" verilator --lint-only -Wall rtl/sad_pe.sv
